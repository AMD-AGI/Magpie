<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="875" viewBox="0 0 1080 875" role="img" aria-labelledby="title description">
  <title id="title">DI inside one Magpie Ray evaluation</title>
  <desc id="description">The ordinary CLI and BenchmarkMode submit one evaluation through RayJobExecutor. The prepared worker reads the intact configuration and branches for disaggregation. A serving-only DISession reserves one global placement group with one node-bound GPU bundle per engine rank. CPU-only supervisors start HTTP frontends through a pinned adapter; SGLang RayEngine owns the GPU rank actors using that same group. The first prefill frontend also hosts the router. The existing benchmark script runs locally on that evaluation worker in client phase against the explicit endpoint. Existing parsing and reports are reused. Owned cleanup precedes reservation release and normal result return. No second Ray client task or duplicate GPU reservation is introduced.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #182536; font-size: 17px; }
      .title { font-size: 25px; font-weight: 600; }
      .label { font-weight: 600; }
      .detail { font-size: 14px; fill: #445368; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .existing { fill: #f4f6f8; stroke: #b8c2cf; stroke-width: 1.5; }
      .extended { fill: #edf5ff; stroke: #377bc3; stroke-width: 1.5; }
      .new { fill: #fff7e8; stroke: #b87916; stroke-width: 1.5; }
      .wire { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="875" rx="12" fill="#ffffff"/>
  <text x="35" y="40" class="title">DI inside one Magpie Ray evaluation</text>
  <rect x="35" y="65" width="15" height="15" rx="3" class="existing"/><text x="59" y="78" class="detail">Reused</text>
  <rect x="170" y="65" width="15" height="15" rx="3" class="extended"/><text x="194" y="78" class="detail">DI extension</text>
  <rect x="335" y="65" width="15" height="15" rx="3" class="new"/><text x="359" y="78" class="detail">New serving lifecycle</text>
  <text x="40" y="116" class="label">Driver</text>
  <rect x="40" y="135" width="320" height="92" rx="8" class="existing"/>
  <text x="200" y="160" text-anchor="middle" class="label">CLI + BenchmarkMode.run</text>
  <text x="200" y="185" text-anchor="middle" class="code">python -m Magpie benchmark</text>
  <text x="200" y="207" text-anchor="middle" class="detail">Keep the existing entry point</text>
  <path d="M200 227 V264" class="wire"/>
  <rect x="40" y="270" width="320" height="90" rx="8" class="existing"/>
  <text x="200" y="297" text-anchor="middle" class="label">RayJobExecutor</text>
  <text x="200" y="322" text-anchor="middle" class="detail">ONE evaluation task</text>
  <text x="200" y="344" text-anchor="middle" class="detail">Submit the intact benchmark config</text>
  <rect x="40" y="420" width="320" height="190" rx="8" class="extended"/>
  <text x="60" y="447" class="label">Under benchmark</text>
  <text x="60" y="474" class="code">envs: {TP: 8, EP: 1}</text>
  <text x="60" y="496" class="code">disaggregation:</text>
  <text x="75" y="518" class="code">prefill: {instances: 1}</text>
  <text x="75" y="540" class="code">decode:</text>
  <text x="90" y="562" class="code">instances: 1</text>
  <text x="90" y="584" class="code">envs: {EP: 8}</text>
  <rect x="460" y="105" width="590" height="697" rx="12" fill="#fbfcfe" stroke="#b8c2cf" stroke-width="1.5"/>
  <text x="485" y="134" class="label">Evaluation task on a prepared worker</text>
  <path d="M360 315 H423 V205 H479" class="wire"/>
  <text x="391" y="292" text-anchor="middle" class="detail">Task</text>
  <rect x="485" y="160" width="540" height="90" rx="8" class="extended"/>
  <text x="755" y="186" text-anchor="middle" class="label">Worker chooses the DI path</text>
  <text x="755" y="210" text-anchor="middle" class="detail">remote.tasks._run_benchmark keeps the config intact</text>
  <text x="755" y="232" text-anchor="middle" class="detail">Ordinary jobs keep their existing worker path</text>
  <path d="M755 250 V289" class="wire"/>
  <rect x="485" y="295" width="540" height="90" rx="8" class="new"/>
  <text x="755" y="321" text-anchor="middle" class="label">DISession starts distributed serving</text>
  <text x="755" y="345" text-anchor="middle" class="detail">CPU supervisors + SGLang GPU ranks across Ray nodes</text>
  <text x="755" y="367" text-anchor="middle" class="detail">One placement group; one node-bound GPU bundle per rank</text>
  <path d="M755 385 V424" class="wire"/>
  <rect x="485" y="430" width="540" height="84" rx="8" class="existing"/>
  <text x="755" y="455" text-anchor="middle" class="label">Existing benchmark script</text>
  <text x="755" y="479" text-anchor="middle" class="code">phase=client; endpoint=session.endpoint</text>
  <text x="755" y="501" text-anchor="middle" class="detail">Same evaluation worker; no second Ray client task</text>
  <path d="M755 514 V549" class="wire"/>
  <rect x="485" y="555" width="540" height="62" rx="8" class="existing"/>
  <text x="755" y="580" text-anchor="middle" class="label">Existing parsing + reports</text>
  <text x="755" y="602" text-anchor="middle" class="detail">Save the normal benchmark results and artifacts</text>
  <path d="M755 617 V654" class="wire"/>
  <rect x="485" y="660" width="540" height="90" rx="8" class="new"/>
  <text x="755" y="686" text-anchor="middle" class="label">Collect + stop owned serving</text>
  <text x="755" y="710" text-anchor="middle" class="detail">Confirm client/frontend/rank cleanup, then release capacity</text>
  <text x="755" y="732" text-anchor="middle" class="detail">Keep journals in the result workspace's di-session/</text>
  <path d="M485 705 H366" class="wire"/>
  <text x="421" y="690" text-anchor="middle" class="detail">Return</text>
  <rect x="40" y="660" width="320" height="90" rx="8" class="existing"/>
  <text x="200" y="688" text-anchor="middle" class="label">Driver receives ordinary result</text>
  <text x="200" y="714" text-anchor="middle" class="detail">CLI summary + artifact paths</text>
  <text x="35" y="844" class="detail">Caller supplies the working Ray cluster, worker runtime, devices, model and shared storage.</text>
</svg>

# Benchmark Docker Image Mapping
# Format: framework -> gpu_arch -> docker_image
#
# GPU Architecture Identifiers:
#   AMD: gfx942 (MI300X), gfx950 (MI355X)
#   NVIDIA: sm_80 (A100), sm_90 (H100/H200), sm_100 (B200)
#
# Usage:
#   ImageSelector automatically selects the appropriate image based on detected GPU.
#   If the architecture is not found, an error will be raised.

vllm:
  # AMD GPUs
  gfx942: "vllm/vllm-openai-rocm:v0.19.1"
  gfx950: "vllm/vllm-openai-rocm:v0.19.1"
  # NVIDIA GPUs
  sm_80: "vllm/vllm-openai:v0.19.1"
  sm_90: "vllm/vllm-openai:v0.19.1"
  sm_100: "vllm/vllm-openai:v0.19.1"

sglang:
  # AMD GPUs
  gfx942: "lmsysorg/sglang:v0.5.8-rocm700-mi30x"
  gfx950: "lmsysorg/sglang:v0.5.8-rocm700-mi30x"
  # NVIDIA GPUs
  sm_80: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"
  sm_90: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"
  sm_100: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"

# Atom exposes an OpenAI-compatible HTTP server (atom.entrypoints.openai_server)
# that is wire-compatible with vLLM, so the bench client reuses --backend vllm.
# No dedicated atom Docker image is published yet; we inherit the vLLM image as
# a placeholder. The `atom` Python package must be importable in that image —
# pass --docker-image to override when running.
atom:
  # AMD GPUs
  gfx942: "vllm/vllm-openai-rocm:v0.19.1"
  gfx950: "vllm/vllm-openai-rocm:v0.19.1"
  # NVIDIA GPUs
  sm_80: "vllm/vllm-openai:v0.19.1"
  sm_90: "vllm/vllm-openai:v0.19.1"
  sm_100: "vllm/vllm-openai:v0.19.1"

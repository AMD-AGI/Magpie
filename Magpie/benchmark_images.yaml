# Benchmark Docker Image Mapping
# Format: framework -> gpu_arch -> docker_image
#
# GPU Architecture Identifiers:
#   AMD: gfx942 (MI300X), gfx950 (MI355X)
#   NVIDIA: sm_80 (A100), sm_90 (H100/H200), sm_100 (B200)
#
# Usage:
#   ImageSelector automatically selects the appropriate image based on detected GPU.
#   If the architecture is not found, an error will be raised.

vllm:
  # AMD GPUs
  gfx942: "vllm/vllm-openai-rocm:v0.19.1"
  gfx950: "vllm/vllm-openai-rocm:v0.19.1"
  # NVIDIA GPUs
  sm_80: "vllm/vllm-openai:v0.19.1"
  sm_90: "vllm/vllm-openai:v0.19.1"
  sm_100: "vllm/vllm-openai:v0.19.1"

sglang:
  # AMD GPUs
  gfx942: "lmsysorg/sglang:v0.5.12-rocm720-mi30x"
  gfx950: "lmsysorg/sglang:v0.5.12-rocm720-mi35x"
  # NVIDIA GPUs
  sm_80: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"
  sm_90: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"
  sm_100: "lmsysorg/sglang:v0.5.8-cu130-amd64-runtime"

# Atom exposes an OpenAI-compatible HTTP server (atom.entrypoints.openai_server)
# that is wire-compatible with vLLM, so the bench client reuses --backend vllm.
# Pin a specific tag via --docker-image when reproducibility matters.
#
# Atom is AMD-only: there is no NVIDIA/CUDA atom build, so no sm_* entries are
# listed. Requesting atom on an NVIDIA arch raises an error in ImageSelector
# rather than silently falling back to a vLLM image that cannot run the atom
# server.
atom:
  # AMD GPUs
  gfx942: "rocm/atom:latest"
  gfx950: "rocm/atom:latest"

# xDiT is an offline diffusion CLI run via run_cmd in local mode (no
# InferenceX, no Magpie-launched server). Magpie does not pull these images
# for the offline path; they are listed for reference / optional docker use.
xdit:
  # AMD GPUs
  gfx942: "rocm/pytorch-xdit:v26.5"
  gfx950: "rocm/pytorch-xdit:v26.5"

# vLLM Benchmark Configuration Example
# =====================================
# This example shows how to benchmark vLLM with DeepSeek-R1 model.
#
# Usage:
#   python -m Magpie benchmark --benchmark-config examples/benchmarks/benchmark_sqlang_amd_dsr1_fp4.yaml
#
# Prerequisites:
#   - Docker with GPU support
#   - HuggingFace token (HF_TOKEN) for gated models

benchmark:
  framework: sglang
  model: amd/DeepSeek-R1-MXFP4
  precision: fp4
  run_mode: docker
  
  # Environment variables
  envs:
    TP: 8
    CONC: 64
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    TL_EXTENSION: "TraceLens_NDA" # Optional: specify TraceLens extension to load
  
  # Profiler configuration
  profiler:
    torch_profiler:
      enabled: true
    system_profiler:
      enabled: false
    tracelens:
      enabled: true
      
  gap_analysis:
    enabled: false
    find_kernel_sources: false
    top_k: 100

  # Will auto-clone InferenceX if not specified
  # inferencex_path: ""
  # image: "image with TraceLens_NDA extension pre-installed" 
  benchmark_script: "dsr1_fp4_mi355x.sh"

  timeout_seconds: 3600

# vLLM Benchmark Configuration for MiniMaxAI/MiniMax-M3-MXFP8 (TP8, EP1)
# =======================================================================
#
# Usage (Docker - default):
#   python -m Magpie benchmark --benchmark-config \
#     examples/benchmarks/benchmark_vllm_mini_max_3_mxfp8_tp8.yaml
#
# Usage (Local - run directly on host, e.g. inside a pod):
#   python -m Magpie benchmark --benchmark-config \
#     examples/benchmarks/benchmark_vllm_mini_max_3_mxfp8_tp8.yaml \
#     --run-mode local
#
# Uses Magpie generic script vllm_mi355x.sh on 8x MI355X (gfx950).
# Serve flags follow the MXFP4 TP8 example so the two precisions compare
# directly. M3 MSA requires --block-size 128.

benchmark:
  framework: vllm
  model: MiniMaxAI/MiniMax-M3-MXFP8
  precision: mxfp8
  run_mode: docker
  gpu_arch: gfx950

  envs:
    TP: 8
    CONC: 32
    ISL: 1024
    OSL: 1024
    NUM_PROMPTS: 64
    RANDOM_RANGE_RATIO: 1
    MAX_MODEL_LEN: 4096
    GPU_MEMORY_UTILIZATION: 0.9
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_USE_AITER_MOE: 1
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: 1
    VLLM_ENGINE_READY_TIMEOUT_S: 3600
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 1800
    EXTRA_VLLM_ARGS: >-
      --dtype bfloat16
      --block-size 128
      --max-num-batched-tokens 32768
      --max-num-seqs 256
      --kv-cache-dtype fp8
      --no-enable-prefix-caching
      --attention-backend TRITON_ATTN
      --moe-backend aiter
      --compilation-config={"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":256}
      --language-model-only
      --tool-call-parser minimax_m3
      --reasoning-parser minimax_m3
      --enable-auto-tool-choice

  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false

  docker_image: "vllm/vllm-openai-rocm:v0.29.0"
  # hf_cache_path: ""
  benchmark_script: "vllm_mi355x.sh"
  timeout_seconds: 14400

  gap_analysis:
    enabled: false
    top_k: 100
    find_kernel_sources: false

# Review draft. Single-node port of InferenceBench deepseek-v4-pro.
# The InferenceBench P/D recipe additionally applies a version-pinned Mooncake binary patch.
benchmark:
  framework: sglang
  model: /data/haoli103/models/DeepSeek-V4-Pro
  precision: mxfp4
  run_mode: docker
  gpu_arch: gfx950

  # Environment variables
  envs:
    TP: 8
    CONC: 32
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 0.8
    SGLANG_USE_AITER: 1
    SGLANG_AITER_MLA_PERSIST: 1

  # Profiler configuration
  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false

  docker_image: "lmsysorg/sglang:v0.5.14-rocm720-mi35x"
  hf_cache_path: "/data/haoli103/huggingface"
  benchmark_script: "sglang_mi355x.sh"
  timeout_seconds: 10800

  gap_analysis:
    enabled: false
    top_k: 100
    find_kernel_sources: false

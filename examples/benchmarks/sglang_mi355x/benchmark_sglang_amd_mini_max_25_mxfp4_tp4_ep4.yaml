# SGLang Benchmark Configuration for amd/MiniMax-M2.5-MXFP4 (TP4/EP4)
# ===================================================================
#
# Usage (Docker - default):
#   python -m Magpie benchmark --benchmark-config examples/benchmarks/sglang_mi355x/benchmark_sglang_amd_mini_max_25_mxfp4_tp4_ep4.yaml
#
# Usage (Local - run directly on host, e.g. inside a pod):
#   python -m Magpie benchmark --benchmark-config examples/benchmarks/sglang_mi355x/benchmark_sglang_amd_mini_max_25_mxfp4_tp4_ep4.yaml --run-mode local
#
# Stock SGLang on 4x MI355X (gfx950) with TP4/EP4, using AITER attention and
# MoE backends and the MiniMax-M2 tool-call and reasoning parsers.

benchmark:
  framework: sglang
  model: amd/MiniMax-M2.5-MXFP4
  precision: mxfp4
  run_mode: docker
  gpu_arch: gfx950

  # Environment variables
  envs:
    TP: 4
    CONC: 32
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 1
    AITER_KSPLIT: "0"
    HIP_FORCE_DEV_KERNARG: "1"
    HSA_NO_SCRATCH_RECLAIM: "1"
    NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_CUMEM_HOST_ENABLE: "0"
    NCCL_DEBUG: WARN
    NCCL_DMABUF_ENABLE: "0"
    NCCL_MIN_NCHANNELS: "112"
    NCCL_NVLS_ENABLE: "0"
    RCCL_MSCCL_ENABLE: "0"
    SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
    SGLANG_DISABLE_CUDNN_CHECK: "1"
    SGLANG_MOE_PADDING: "1"
    SGLANG_ROCM_DISABLE_LINEARQUANT: "0"
    SGLANG_ROCM_FUSED_DECODE_MLA: "1"
    SGLANG_SET_CPU_AFFINITY: "1"
    SGLANG_USE_AITER: "1"
    SGLANG_USE_ROCM700A: "0"
    # CONC controls client concurrency; request and decode graph limits use SGLang defaults.
    # Optional: add --max-running-requests N and --cuda-graph-max-bs N below to tune.
    EXTRA_SGLANG_ARGS: >-
      --tool-call-parser minimax-m2
      --reasoning-parser minimax-append-think
      --expert-parallel-size 4
      --moe-a2a-backend none
      --model-impl sglang
      --dtype bfloat16
      --quantization quark
      --context-length 65536
      --kv-cache-dtype fp8_e4m3
      --attention-backend aiter
      --moe-runner-backend aiter
      --mem-fraction-static 0.80
      --chunked-prefill-size 8192
      --disable-radix-cache

  # Profiler configuration
  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false

  docker_image: "lmsysorg/sglang:v0.5.18-rocm720-mi35x"
  # hf_cache_path: ""
  benchmark_script: "sglang_mi355x.sh"
  timeout_seconds: 10800

  gap_analysis:
    enabled: false
    top_k: 100
    find_kernel_sources: false

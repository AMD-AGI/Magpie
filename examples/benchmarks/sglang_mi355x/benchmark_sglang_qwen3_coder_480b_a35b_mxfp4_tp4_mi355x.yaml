# Review draft. Model ID exists, but InferenceBench has no matching SGLang recipe.
benchmark:
  framework: sglang
  model: amd/Qwen3-Coder-480B-A35B-Instruct-MXFP4
  precision: mxfp4
  run_mode: docker
  gpu_arch: gfx950

  # Environment variables
  envs:
    TP: 4
    CONC: 32
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 0.8
    SGLANG_USE_AITER: 1

  # Profiler configuration
  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false

  docker_image: "lmsysorg/sglang:v0.5.14-rocm720-mi35x"
  hf_cache_path: "/data/haoli103/huggingface"
  benchmark_script: "sglang_mi355x.sh"
  timeout_seconds: 7200

  gap_analysis:
    enabled: false
    top_k: 100
    find_kernel_sources: false

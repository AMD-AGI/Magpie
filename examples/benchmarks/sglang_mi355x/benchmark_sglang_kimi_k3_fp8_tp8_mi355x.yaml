# BLOCKED review draft. TP8 assumed. No official standalone Kimi-K3 FP8
# checkpoint was found; replace this local placeholder before running.
benchmark:
  framework: sglang
  model: /data/haoli103/models/Kimi-K3-FP8
  precision: fp8
  run_mode: docker
  gpu_arch: gfx950

  # Environment variables
  envs:
    TP: 8
    CONC: 32
    ISL: 1024
    OSL: 1024
    RANDOM_RANGE_RATIO: 0.8
    SGLANG_USE_AITER: 1

  # Profiler configuration
  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false
    tracelens:
      enabled: false

  docker_image: "lmsysorg/sglang:v0.5.14-rocm720-mi35x"
  hf_cache_path: "/data/haoli103/huggingface"
  benchmark_script: "sglang_mi355x.sh"
  timeout_seconds: 14400

  gap_analysis:
    enabled: false
    top_k: 100
    find_kernel_sources: false

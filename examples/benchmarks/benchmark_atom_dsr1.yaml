# Atom Benchmark Configuration Example
# =====================================
# This example shows how to benchmark Atom with DeepSeek-R1 model.
#
# Atom exposes an OpenAI-compatible HTTP server at
# atom.entrypoints.openai_server and is wire-compatible with vLLM, so
# the bench client reuses --backend vllm under the hood.
#
# Usage:
#   python -m Magpie benchmark --benchmark-config examples/benchmarks/benchmark_atom_dsr1.yaml
#
# Prerequisites:
#   - The `atom` Python package importable in the runtime environment
#   - HuggingFace token (HF_TOKEN) for gated models
#
# Known limitations (v1):
#   - Single-node only. Multi-node Ray TP auto-config is not yet wired
#     for atom in Magpie/remote/tasks.py (will fall through to
#     "Unknown framework" and skip --use-ray injection).
#   - Atom torch-profiler integration is not yet implemented;
#     PROFILE=1 will be ignored by the launch script.

benchmark:
  framework: atom
  model: /shared_nfs/Llamas/huggingface/DeepSeek-R1-0528
  precision: fp8
  run_mode: local

  # Environment variables
  envs:
    TP: 8
    CONC: 32
    ISL: 128
    OSL: 128
    RANDOM_RANGE_RATIO: 0.8
    MAX_MODEL_LEN: 4090
    # EXTRA_ATOM_ARGS: "--your-atom-flag value"

  # Profiler configuration (atom profiler wiring is a follow-up;
  # leaving torch_profiler disabled for now).
  profiler:
    torch_profiler:
      enabled: false
    system_profiler:
      enabled: false

  gap_analysis:
    enabled: false
    trace_start_pct: 50
    trace_end_pct: 80
    top_k: 20

  # Optional: auto-pick idle GPU(s) before launching. Enabled by default;
  # uncomment to override (see docs/benchmark.md#automatic-gpu-selection).
  # gpu_selection:
  #   auto: true
  #   min_free_memory_gb: 8.0
  #   count: null              # null -> use envs.TP
  #   candidates: [0, 1, 2, 3] # whitelist physical GPU ids

  # Will auto-clone InferenceX if not specified
  # inferencex_path: ""

  # Timeout (DeepSeek-R1 needs time to load)
  timeout_seconds: 3600
